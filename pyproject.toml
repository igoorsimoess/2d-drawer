[project]
name = "desenhador2d"
version = "2.0.0"
description = "Desenhador de primitivos graficos 2D com rasterizacao propria"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
